<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wassertemperatur Alzkanal</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; text-align: center; }
    .bigFont { font-size: 3rem; font-weight: 700; margin-bottom: 1rem;}
    .smallFont { color: #666; margin: 0.25rem 0;}
  </style>
</head>
<body>
  <h2>Aktuelle Wassertemperatur</h2>
  <div class="bigFont" id="temp">--.-- °C</div>
  <p class="smallFont" id="vbat">VBat: -.-- V</p>
  <p class="smallFont" id="etemp">BoxTemp: --.-- °C</p>
  <p class="smallFont" id="rssi">RSSI: ---.- dBm</p>
  <p class="smallFont" id="txpwr">TxPwr: ---.-- dBm</p>
  <p class="smallFont" id="updated">Letztes Update: --</p>

  <script>
  async function loadData() {
    const response = await fetch(
      "https://raw.githubusercontent.com/gerhstic/Tacherting-Alzkanal-KM7-2/main/data.json?nocache=" + Date.now(),
      { cache: "no-store" }
    );
    const data = await response.json();

    document.getElementById("temp").textContent =
      Number(data.temperature).toFixed(2) + " °C";

    document.getElementById("vbat").textContent =
      "VBat: " + Number(data.vbat).toFixed(2) + " V";
    
    document.getElementById("etemp").textContent =
      "BoxTemp: " + Number(data.etemp).toFixed(2) + " °C";
    
    document.getElementById("rssi").textContent =
      "RSSI: " + Number(data.rssi).toFixed(2) + " dBm";
    
    document.getElementById("txpwr").textContent =
      "TxPwr: " + Number(data.txpwr).toFixed(2) + " dBm";
    
    document.getElementById("updated").textContent =
      "(" + new Date(data.updated).toLocaleString("de-DE") + ")"
  }

  loadData();
  setInterval(loadData, 60000);</script>
</body>
</html>
