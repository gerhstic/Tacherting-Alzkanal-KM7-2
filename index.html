<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wassertemperatur Alzkanal</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; text-align: center; }
    .temp { font-size: 4rem; font-weight: 700; }
    .small { color: #666; }
  </style>
</head>
<body>
  <h1>Aktuelle Wassertemperatur</h1>
  <div class="temp" id="temp">--.- °C</div>
  <p class="small" id="updated">Letztes Update: --</p>

  <script>
    async function loadData() {
      const r = await fetch("data.json?nocache=" + Date.now());
      const d = await r.json();

      document.getElementById("temp").textContent =
        Number(d.temperature).toFixed(1) + " °C";

      document.getElementById("updated").textContent =
        "Letztes Update: " + new Date(d.updated).toLocaleString("de-DE");
    }

    loadData();
  </script>
</body>
</html>
